<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>iPhone and Apple Watch side by side, the iPhone shows a Continue card</title>
  <rect class="f-accent-soft" width="480" height="300" rx="24" opacity="0.55"/>
  <rect class="f-soft s-ink" x="50" y="30" width="140" height="240" rx="26" stroke-width="3"/>
  <rect class="f-paper s-ink" x="60" y="44" width="120" height="212" rx="16" stroke-width="2"/>
  <rect class="f-accent-soft s-accent" x="68" y="150" width="104" height="96" rx="14" stroke-width="2"/>
  <rect class="f-muted" x="80" y="164" width="60" height="7" rx="3.5"/>
  <rect class="f-muted" x="80" y="180" width="44" height="7" rx="3.5"/>
  <rect class="f-accent" x="82" y="206" width="76" height="26" rx="13"/>
  <circle class="s-hl anim-tap" cx="120" cy="219" r="22" fill="none" stroke-width="3"/>
