    <rect class="f-soft s-ink" x="176" y="56" width="128" height="188" rx="42" stroke-width="3"/>
    <rect class="f-ink" x="188" y="70" width="104" height="160" rx="32"/>
    <circle class="f-paper" cx="240" cy="150" r="14"/>
    <rect class="f-muted s-ink" x="304" y="104" width="14" height="34" rx="6" stroke-width="2"/>
    <rect class="f-muted s-ink" x="304" y="152" width="10" height="40" rx="5" stroke-width="2"/>
  </g>
</svg>
