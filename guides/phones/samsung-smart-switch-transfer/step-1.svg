<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>Old phone and new Galaxy phone side by side, both with charged batteries</title>
  <rect class="f-accent-soft" width="480" height="300" rx="24" opacity="0.55"/>
  <g transform="translate(60 40) scale(0.8)">
    <rect class="f-soft s-ink" x="0" y="0" width="140" height="272" rx="26" stroke-width="3"/>
    <rect class="f-paper s-ink" x="10" y="16" width="120" height="240" rx="16" stroke-width="2"/>
    <rect class="f-ink" x="56" y="7" width="28" height="5" rx="2.5"/>
    <rect class="f-muted" x="24" y="60" width="60" height="8" rx="4"/>
    <rect class="f-muted" x="24" y="80" width="80" height="8" rx="4"/>
    <rect class="f-muted" x="24" y="100" width="40" height="8" rx="4"/>
  </g>
  <g transform="translate(310 30) scale(0.85)">
    <rect class="f-soft s-ink" x="0" y="0" width="140" height="272" rx="26" stroke-width="3"/>
    <rect class="f-paper s-ink" x="10" y="16" width="120" height="240" rx="16" stroke-width="2"/>
    <rect class="f-ink" x="56" y="7" width="28" height="5" rx="2.5"/>
    <rect class="f-muted" x="24" y="60" width="60" height="8" rx="4"/>
    <rect class="f-muted" x="24" y="80" width="80" height="8" rx="4"/>
    <rect class="f-muted" x="24" y="100" width="40" height="8" rx="4"/>
    <rect class="f-accent s-ink" x="30" y="190" width="80" height="26" rx="13" stroke-width="2"/>
    <rect class="s-hl anim-pulse" x="25" y="185" width="90" height="36" rx="18" stroke-width="3" fill="none"/>
  </g>
  <path class="s-hl" d="M190 150 H290" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" stroke-dasharray="3 9"/>
  <rect class="f-paper s-ink" x="70" y="262" width="40" height="20" rx="5" stroke-width="2.5"/>
  <rect class="f-ok" x="74" y="266" width="26" height="12" rx="3"/>
  <rect class="f-ink" x="110" y="268" width="4" height="8" rx="2"/>
</svg>
