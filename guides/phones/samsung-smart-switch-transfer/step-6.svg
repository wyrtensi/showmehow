<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>New phone showing a full progress bar and a big check mark when the transfer is finished</title>
  <rect class="f-accent-soft" width="480" height="300" rx="24" opacity="0.55"/>
  <g transform="translate(170 14) scale(1)">
    <rect class="f-soft s-ink" x="0" y="0" width="140" height="272" rx="26" stroke-width="3"/>
    <rect class="f-paper s-ink" x="10" y="16" width="120" height="240" rx="16" stroke-width="2"/>
    <rect class="f-ink" x="56" y="7" width="28" height="5" rx="2.5"/>
    <circle class="f-accent-soft s-accent" cx="70" cy="96" r="38" stroke-width="3"/>
    <path class="s-accent" d="M52 96 L66 110 L90 82" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <rect class="f-soft s-ink" x="20" y="154" width="100" height="12" rx="6" stroke-width="2"/>
    <rect class="f-accent" x="20" y="154" width="100" height="12" rx="6"/>
    <rect class="f-muted" x="30" y="182" width="80" height="8" rx="4"/>
    <rect class="f-accent s-ink" x="26" y="212" width="88" height="26" rx="13" stroke-width="2"/>
    <rect class="s-hl anim-pulse" x="21" y="207" width="98" height="36" rx="18" stroke-width="3" fill="none"/>
  </g>
</svg>
