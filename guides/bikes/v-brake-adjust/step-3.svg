<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>Each brake pad sits flat on the rim braking surface, below the tyre and not hanging off the rim</title>
  <rect class="f-accent-soft" width="480" height="300" rx="24" opacity="0.55"/>
  <rect class="f-soft s-ink" x="160" y="20" width="160" height="70" rx="12" stroke-width="3"/>
  <rect class="f-muted s-ink" x="220" y="90" width="40" height="190" rx="4" stroke-width="3"/>
  <rect class="f-accent s-ink" x="170" y="130" width="40" height="70" rx="6" stroke-width="3"/>
  <rect class="f-accent s-ink" x="270" y="130" width="40" height="70" rx="6" stroke-width="3"/>
  <path class="s-ink" d="M120 100 Q150 100 170 130 M360 100 Q330 100 310 130" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="s-hl anim-pulse" cx="190" cy="165" r="36" fill="none" stroke-width="3"/>
  <circle class="s-hl anim-pulse" cx="290" cy="165" r="36" fill="none" stroke-width="3"/>
</svg>
