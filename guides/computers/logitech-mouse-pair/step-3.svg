  <g transform="translate(-45 0) scale(0.95 1)">
  <path class="f-soft s-ink" d="M240 24 C320 24 350 80 350 160 C350 240 310 280 240 280 C170 280 130 240 130 160 C130 80 160 24 240 24 Z" stroke-width="3"/>
