<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>The robot drives through every room and draws the map on its first run</title>
  <rect class="f-accent-soft" width="480" height="300" rx="24" opacity="0.55"/>
  <rect class="f-paper s-ink" x="60" y="30" width="360" height="240" rx="10" stroke-width="3"/>
  <path class="s-ink" d="M240 30 L240 120" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="s-ink" d="M240 180 L240 270" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="f-soft s-ink" x="62" y="130" width="40" height="70" rx="8" stroke-width="2"/>
  <path class="s-hl" d="M110 165 H220 M220 165 V70 H130 V50 H220 M280 60 H390 M390 60 V240 H280 V215 H390" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="f-soft s-ink" cx="300" cy="120" r="14" stroke-width="3"/>
  <circle class="f-accent" cx="300" cy="120" r="4" stroke-width="0"/>
  <path class="s-hl anim-nudge" d="M262 140 H400" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
