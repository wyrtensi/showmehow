  <rect class="f-paper s-ink" x="350" y="70" width="40" height="140" rx="4" stroke-width="3"/>
  <rect class="f-hl s-ink" x="100" y="210" width="8" height="22" rx="3" stroke-width="2"/>
  <rect class="f-hl s-ink" x="118" y="210" width="8" height="22" rx="3" stroke-width="2"/>
  <rect class="f-hl s-ink" x="360" y="210" width="8" height="22" rx="3" stroke-width="2"/>
  <rect class="f-hl s-ink" x="378" y="210" width="8" height="22" rx="3" stroke-width="2"/>
