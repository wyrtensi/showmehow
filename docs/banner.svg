<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Show Me How</title>
  <desc id="d">Short illustrated step-by-step guides for everyday devices: a phone, earbuds in a case, a router and a chest of drawers, connected by numbered steps.</desc>
  <style>
    svg { --bg: #fff4e3; --bg2: #ffe6c7; --ink: #27303c; --soft: #ffffff; --muted: #d9cdbb; --accent: #e5603a; --accent-soft: #f9c9b5; --hl: #f0a30a; --ok: #3fae6a; --sub: #4a5461; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a212b; --bg2: #232c39; --ink: #e9eef4; --soft: #2b3646; --muted: #46546a; --accent: #ff7d58; --accent-soft: #5a3a33; --hl: #ffc247; --ok: #5fd08a; --sub: #aab5c3; }
    }
    .bg { fill: var(--bg); }
    .bg2 { fill: var(--bg2); }
    .soft { fill: var(--soft); }
    .muted { fill: var(--muted); }
    .ink { stroke: var(--ink); }
    .f-ink { fill: var(--ink); }
    .accent { fill: var(--accent); }
    .accent-soft { fill: var(--accent-soft); }
    .s-accent { stroke: var(--accent); }
    .s-hl { stroke: var(--hl); }
    .ok { fill: var(--ok); }
    .o { stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .d { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wh { stroke: #fff; }
    .txt { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    .title { font-size: 74px; font-weight: 800; fill: var(--ink); letter-spacing: -1px; }
    .sub { font-size: 27px; font-weight: 500; fill: var(--sub); }
    .ru { font-size: 22px; font-weight: 500; fill: var(--accent); }
    .num { font-size: 18px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>

  <defs><clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath></defs>
  <rect class="bg" width="1280" height="360" rx="28"/>
  <g clip-path="url(#card)">
    <circle class="bg2" cx="1130" cy="40" r="210"/>
    <circle class="bg2" cx="40" cy="360" r="130"/>
  </g>
  <rect class="bg2" x="600" y="300" width="620" height="6" rx="3"/>

  <!-- title block -->
  <text class="txt title" x="64" y="156">Show Me How</text>
  <path class="s-accent" d="M68 184 q22 -14 44 0 t44 0 t44 0 t44 0 t44 0 t44 0" fill="none" stroke-width="7" stroke-linecap="round"/>
  <text class="txt sub" x="64" y="236">Short illustrated step-by-step guides</text>
  <text class="txt sub" x="64" y="272">for everyday devices</text>
  <text class="txt ru" x="64" y="318">Покажи, как: инструкции с картинками</text>

  <!-- step trail -->
  <path class="s-hl" d="M714 72 H810 M842 72 H976 M1008 72 H1146" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g>
    <circle class="accent" cx="698" cy="72" r="18"/><text class="txt num" x="698" y="78">1</text>
    <circle class="accent" cx="826" cy="72" r="18"/><text class="txt num" x="826" y="78">2</text>
    <circle class="accent" cx="992" cy="72" r="18"/><text class="txt num" x="992" y="78">3</text>
    <circle class="accent" cx="1170" cy="72" r="18"/><text class="txt num" x="1170" y="78">4</text>
  </g>

  <!-- phone with a checklist -->
  <rect class="soft ink o" x="660" y="110" width="76" height="190" rx="14"/>
  <rect class="muted" x="668" y="124" width="60" height="158" rx="6"/>
  <rect class="muted" x="688" y="114" width="20" height="4" rx="2"/>
  <circle class="ok" cx="682" cy="146" r="8"/>
  <path class="wh d" d="M678 146 l3 3 l5 -6"/>
  <rect class="soft" x="696" y="142" width="26" height="8" rx="4"/>
  <circle class="accent" cx="682" cy="176" r="8"/>
  <rect class="soft" x="696" y="172" width="26" height="8" rx="4"/>
  <circle class="soft" cx="682" cy="206" r="8"/>
  <rect class="soft" x="696" y="202" width="26" height="8" rx="4"/>
  <circle class="soft" cx="682" cy="236" r="8"/>
  <rect class="soft" x="696" y="232" width="26" height="8" rx="4"/>

  <!-- earbuds case with a pulsing button -->
  <rect class="soft ink o" x="776" y="132" width="100" height="168" rx="36"/>
  <path class="ink d" d="M776 184 H876"/>
  <rect class="muted" x="811" y="138" width="30" height="10" rx="5"/>
  <circle class="ok" cx="826" cy="162" r="6"/>
  <circle class="soft ink o" cx="826" cy="246" r="12" stroke-width="3"/>
  <circle class="accent" cx="826" cy="246" r="6"/>
  <circle class="s-hl" cx="826" cy="246" r="26" fill="none" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- router with signal arcs -->
  <path class="ink o" d="M932 252 L926 188 M1052 252 L1058 188" fill="none"/>
  <circle class="accent" cx="926" cy="184" r="7"/>
  <circle class="accent" cx="1058" cy="184" r="7"/>
  <rect class="soft ink o" x="906" y="252" width="172" height="48" rx="14"/>
  <circle class="ok" cx="932" cy="276" r="5"/>
  <circle class="ok" cx="950" cy="276" r="5"/>
  <circle class="muted" cx="968" cy="276" r="5"/>
  <rect class="muted" x="1000" y="270" width="14" height="12" rx="3"/>
  <rect class="muted" x="1020" y="270" width="14" height="12" rx="3"/>
  <rect class="muted" x="1040" y="270" width="14" height="12" rx="3"/>
  <path class="s-accent" d="M975 223 A24 24 0 0 1 1009 223 M961 208 A44 44 0 0 1 1023 208 M947 193 A64 64 0 0 1 1037 193" fill="none" stroke-width="5" stroke-linecap="round"/>

  <!-- chest of drawers -->
  <rect class="soft ink o" x="1116" y="150" width="108" height="150" rx="10"/>
  <path class="ink d" d="M1116 200 H1224 M1116 250 H1224"/>
  <rect class="accent" x="1154" y="170" width="32" height="8" rx="4"/>
  <rect class="muted" x="1154" y="220" width="32" height="8" rx="4"/>
  <rect class="muted" x="1154" y="270" width="32" height="8" rx="4"/>
  <path class="f-ink" d="M1128 300 v10 h12 v-10 z M1200 300 v10 h12 v-10 z" stroke="none"/>
</svg>
